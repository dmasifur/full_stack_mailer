[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.4",
    "celery>=5.6.3",
    "cryptography>=48.0.0",
    "dnspython>=2.8.0",
    "email-validator>=2.3.0",
    "fastapi>=0.136.3",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.29",
    "redis>=7.4.0",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.50",
    "upstash-redis>=1.7.0",
    "uvicorn>=0.48.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.14",
]


[tool.ruff]
target-version = "py314"          # pin to your actual minimum Python
line-length = 88                  # matches Black; no religious wars needed
src = ["app", "tests"]            # tell ruff where your packages live

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes (undefined names, unused imports, etc.)
    "I",    # isort (import ordering)
    "N",    # pep8-naming
    "UP",   # pyupgrade (modernize syntax automatically)
    "B",    # flake8-bugbear (opinionated, catches real bugs)
    "C4",   # flake8-comprehensions (simplify list/dict/set comprehensions)
    "SIM",  # flake8-simplify (reduce unnecessary complexity)
    "TID",  # flake8-tidy-imports (ban relative imports if you want)
    "RUF",  # ruff-native rules
]

ignore = [
    "E501",   # line too long — handled by formatter, not linter
    "B008",   # do not perform function calls in default args (FastAPI Depends() pattern)
    "N805",   # first arg of method should be self — clashes with Pydantic validators
    "SIM108", # ternary operator — sometimes if/else is genuinely clearer
    "SIM",
]

# Auto-fixable rules — safe to apply in CI with --fix
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
known-first-party = ["app"]  # Add package name
force-sort-within-sections = true
split-on-trailing-comma = true

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",  # assert is fine in tests
    "N802",  # lowercase function names — pytest fixtures often break this
]
"**/migrations/**/*.py" = [
    "E501",  # Django/Alembic migrations: auto-generated, don't touch
    "N999",  # module name format — migration filenames are auto-generated
]
"scripts/**/*.py" = [
    "T201",  # print() is fine in one-off scripts
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
