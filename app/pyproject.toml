[project]
name = "full-stack-mailer"
version = "0.1.0"
description = "Bulk email campaign service sending via the Microsoft Graph API."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.4",
    "boto3>=1.43.20",
    "celery>=5.6.3",
    "cryptography>=48.0.0",
    "dnspython>=2.8.0",
    "email-validator>=2.3.0",
    "fastapi>=0.136.3",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.29",
    "redis>=7.4.0",
    "requests>=2.34.2",
    "slowapi>=0.1.9",
    "sqlalchemy>=2.0.50",
    "uvicorn>=0.48.0",
]

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.43.78",
    "celery-types>=0.26.0",
    "mypy>=2.3.1",
    "pytest>=9.0.3",
    "ruff>=0.15.14",
    "types-requests>=2.33.0.20260712",
]

# Without this, setuptools' flat-layout discovery finds `server` and `migrations`
# side by side, refuses to guess, and the build fails. `migrations` and `tests`
# are deployment/verification artefacts, not part of the distributed package.
[tool.setuptools.packages.find]
include = ["server*"]


[tool.mypy]
python_version = "3.14"
files = ["server", "main.py", "tests"]
strict = true
plugins = ["pydantic.mypy"]

# Point at the real source of a type error rather than the line that consumed it.
pretty = true
show_error_codes = true
# An ignore that stops being needed is itself an error, so the suppressions below
# cannot quietly rot.
warn_unused_ignores = true
warn_unreachable = true

# The one part of `strict` deliberately switched off. no_implicit_reexport
# polices what a module re-exports, which matters for a published library whose
# import surface is a contract. This is an application: nothing imports it. Its
# only real effect here is to reject `monkeypatch.setattr(health.settings, ...)`
# — patching a name as the module under test sees it, which is the correct way
# to write those tests.
implicit_reexport = true

[[tool.mypy.overrides]]
# Alembic revisions are generated, and their module names are hashes.
module = "migrations.*"
ignore_errors = true

[[tool.mypy.overrides]]
# Tests stay type-checked — their bodies, their assertions, and every call they
# make into app code. Only the signature requirements are relaxed: a pytest test
# is always `-> None`, and annotating each fixture parameter would mean importing
# a type for every fixture to restate what conftest already declares.
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false
disallow_untyped_calls = false

[[tool.mypy.overrides]]
# slowapi ships no py.typed marker. Its decorators would otherwise make every
# rate-limited endpoint implicitly untyped.
module = ["slowapi.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# The server package lives at the project root, alongside tests/.
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:server.*"]


[tool.ruff]
target-version = "py314"          # pin to your actual minimum Python
line-length = 88                  # matches Black; no religious wars needed
src = ["server", "tests"]         # tell ruff where your packages live

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes (undefined names, unused imports, etc.)
    "I",    # isort (import ordering)
    "N",    # pep8-naming
    "UP",   # pyupgrade (modernize syntax automatically)
    "B",    # flake8-bugbear (opinionated, catches real bugs)
    "C4",   # flake8-comprehensions (simplify list/dict/set comprehensions)
    "SIM",  # flake8-simplify (reduce unnecessary complexity)
    "TID",  # flake8-tidy-imports (ban relative imports if you want)
    "RUF",  # ruff-native rules
]

ignore = [
    "E501",   # line too long — handled by formatter, not linter
    "B008",   # do not perform function calls in default args (FastAPI Depends() pattern)
    "N805",   # first arg of method should be self — clashes with Pydantic validators
    "SIM108", # ternary operator — sometimes if/else is genuinely clearer
]

# Auto-fixable rules — safe to apply in CI with --fix
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
known-first-party = ["server"]  # Add package name
force-sort-within-sections = true
split-on-trailing-comma = true

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",  # assert is fine in tests
    "N802",  # lowercase function names — pytest fixtures often break this
]
"**/migrations/**/*.py" = [
    "E501",  # Django/Alembic migrations: auto-generated, don't touch
    "N999",  # module name format — migration filenames are auto-generated
]
"scripts/**/*.py" = [
    "T201",  # print() is fine in one-off scripts
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
